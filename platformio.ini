[platformio]
default_envs = om_lite_l2
; Keep the build tree OUT of the Syncthing'd notes folder.
build_dir = /home/slofi/.cache/pio-om-lite/build
libdeps_dir = /home/slofi/.cache/pio-om-lite/libdeps

[env:om_lite_l2]
platform = platformio/espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Never let auto-detect pick a motherboard UART (/dev/ttyS0) when the device is unplugged.
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; The app's USB-Serial-JTAG CDC does not implement esptool's DTR/RTS reset, so the chip must be put
; in the ROM loader by hand: hold BOOT (User), tap RESET, release BOOT. esptool then attaches
; without resetting. Remove this only if the app gains a reset-to-loader path.
upload_flags =
  --before=no_reset
  --after=hard_reset
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
; EST-345: the generated Noto emoji blob is embedded straight into the application image and read
; from the flash mapping (no RAM copy). tools/mkemoji.py writes it; the licence sits next to it.
board_build.embed_files = src/ui/emoji_data.bin

; The Arduino ESP32 core defaults to gnu++11; LovyanGFX's panel tables are static constexpr
; members that C++17 makes inline (C++11/14 needs an out-of-class definition and fails to link).
build_unflags =
  -std=gnu++11
  ; The devkitc board defaults to USB-OTG (TinyUSB). On this board the SoC's USB-Serial-JTAG is the
  ; path that always enumerates (Meshtastic used it), so Serial goes there during bring-up.
  -DARDUINO_USB_MODE=1

build_flags =
  -std=gnu++17
  -D BOARD_HAS_PSRAM=1
  -D ARDUINO_USB_CDC_ON_BOOT=1 -D LORA_FREQ=869.618 -D LORA_BW=62.5 -D LORA_SF=8 -D LORA_CR=8 -D LORA_TX_POWER=22 -D RADIOLIB_STATIC_ONLY=1 -D RADIOLIB_GODMODE=1 -D OM_ENABLE_MESH=1 -D MAX_GROUP_CHANNELS=8
  ; EST-341: BaseChatMesh sizes its contact table from MAX_CONTACTS. MyMesh.h defaults it to 100,
  ; but lib/meshcore/helpers/BaseChatMesh.cpp is compiled without MyMesh.h and falls back to 32, so
  ; the same class had two layouts: the global MyMesh was 15,312 B while MyMesh.cpp wrote it as
  ; 28,096 B, `_store` read as NULL and the first savePrefs() panicked at boot. One define for
  ; every TU, libraries included (build_flags reaches lib builds; build_src_flags would not).
  -D MAX_CONTACTS=100
  -D ARDUINO_USB_MODE=0
  -D CORE_DEBUG_LEVEL=1
  -I src
  -I lib/meshcore_companion

lib_deps =
  lovyan03/LovyanGFX@1.2.27
  bitbank2/JPEGDEC@^1.6.0
  rweather/Crypto@^0.4.0
  densaugeo/base64@^1.1.0
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
